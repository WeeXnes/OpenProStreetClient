version: 59
jobs:
- name: Get Version (private)
  executeInSandbox: false
  jobExecutor: Builder
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: get version
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        echo "Extracting version from src/main.cpp..."
        grep -oP 'const std::string (?:baseVersion|version) = "\K[^"]+' src/main.cpp | head -n 1 > version.txt || echo "1.0" > version.txt
        echo "Version extracted: $(cat version.txt)"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: check if tag exists
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        version=$(cat version.txt)
        echo "Checking if tag '$version' exists on origin..."

        if git ls-remote --tags origin | grep -q "refs/tags/${version}$"; then
            echo "Tag '$version' already exists."

            new_version="${version}-@commit_hash@"
            echo "$new_version" > version.txt
            echo "Updated version.txt to '$new_version' to avoid tag conflict."

            exit 1
        else
            echo "Tag '$version' does not exist. Proceeding with original version."
            exit 0
        fi
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@file:version.txt@'
    condition: ALWAYS
    optional: false
  - type: CreateTagStep
    name: create tag
    tagName: '@file:version.txt@'
    tagMessage: Release Tag for @file:version.txt@
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: master
    userMatch: anyone
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
- name: Build Release Tag
  executeInSandbox: false
  jobExecutor: Builder
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@tag@'
    condition: ALWAYS
    optional: false
  - type: CommandStep
    name: Cross-Compile Windows x86 ASI Plugin
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        chmod +x ./build.sh
        ./build.sh
        mkdir -p ./release
        cp build/OpenProStreetClient.asi ./release/
        cp build/discord_game_sdk.dll ./release/
        cp build/OpenProStreetClient_v*.zip ./release/
    runAs: 0:0
    useTTY: true
    condition: ALWAYS
    optional: false
  - type: PublishArtifactStep
    name: Upload Artifacts
    sourcePath: release
    artifacts: '**'
    condition: ALWAYS
    optional: false
  triggers:
  - type: TagCreateTrigger
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
- name: Build Feature Branch
  executeInSandbox: false
  jobExecutor: Builder
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: compute feature version
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        base=$(grep -oP 'const std::string (?:baseVersion|version) = "\K[^"]+' src/main.cpp | head -n 1 || echo "1.0")
        branch="@branch@"
        if [ -z "$branch" ] || [ "$branch" = "HEAD" ]; then
          branch=$(git name-rev --name-only HEAD 2>/dev/null | sed 's#^remotes/origin/##; s#^tags/##' || echo "feature")
        fi
        sanitized=$(printf '%s' "$branch" | tr '/_ ' '---' | tr -cd 'A-Za-z0-9.-')
        echo "$sanitized" > branch.txt
        echo "${base}-fb-${sanitized}" > version.txt
        echo "Feature build version: $(cat version.txt)"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@file:version.txt@'
    condition: ALWAYS
    optional: false
  - type: CommandStep
    name: Cross-Compile Windows x86 ASI Plugin
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        chmod +x ./build.sh
        OPENPROSTREET_BRANCH="$(cat branch.txt)" ./build.sh
        mkdir -p ./release
        cp build/OpenProStreetClient.asi ./release/
        cp build/discord_game_sdk.dll ./release/
        cp build/OpenProStreetClient_v*.zip ./release/
    runAs: 0:0
    useTTY: true
    condition: ALWAYS
    optional: false
  - type: PublishArtifactStep
    name: Upload Feature Artifacts
    sourcePath: release
    artifacts: '**'
    condition: ALWAYS
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: '** -master'
    userMatch: anyone
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
- name: Verify
  executeInSandbox: false
  jobExecutor: Builder
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Cross-Compile Windows x86 ASI Plugin
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        chmod +x ./build.sh
        ./build.sh
        mkdir -p ./verify
        cp build/OpenProStreetClient.asi build/OpenProStreetClient.asi.debug build/discord_game_sdk.dll ./verify/
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: keep the test build
    sourcePath: verify
    artifacts: '**'
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: PullRequestUpdateTrigger
    branches: master
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600
- name: Mirror to GitHub
  executeInSandbox: false
  jobExecutor: Builder
  steps:
  - type: PushRepository
    name: push to github.com/WeeXnes/OpenProStreetClient
    remoteUrl: https://github.com/WeeXnes/OpenProStreetClient.git
    userName: WeeXnes
    passwordSecret: github-mirror-token
    force: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: master
    userMatch: anyone
  - type: TagCreateTrigger
    projects: OpenProStreet/client
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600
